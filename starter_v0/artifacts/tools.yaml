# Finance assistant tool contract. Keep names and parameter shapes stable.
tools:
  - name: clarify
    description: "Hỏi lại thông tin còn thiếu hoặc xin xác nhận trước một hành động có tác động dữ liệu."
    parameters:
      type: object
      properties:
        question: {type: string, description: "Một câu hỏi ngắn, cụ thể bằng tiếng Việt"}
        response_type: {type: string, enum: [yes_no, free_text], description: "Kiểu phản hồi mong đợi"}
        missing_fields: {type: array, items: {type: string}, description: "Các trường còn thiếu hoặc cần xác nhận"}
      required: [question, response_type, missing_fields]

  - name: get_summary
    description: "Xem tổng thu nhập, tổng chi tiêu, dòng tiền ròng và tỷ lệ tiết kiệm trong một khoảng thời gian. Chỉ đọc dữ liệu giả lập cục bộ."
    parameters:
      type: object
      properties:
        period: {type: string, enum: [today, this_week, this_month], description: "Khoảng thời gian định sẵn"}
        start_date: {type: string, description: "Ngày bắt đầu YYYY-MM-DD khi cần chỉ rõ khoảng thời gian"}
        end_date: {type: string, description: "Ngày kết thúc YYYY-MM-DD khi cần chỉ rõ khoảng thời gian"}
      required: [period]

  - name: get_category_breakdown
    description: "Xem chi tiết chi tiêu theo một danh mục trong khoảng thời gian. Chỉ đọc dữ liệu giả lập cục bộ."
    parameters:
      type: object
      properties:
        period: {type: string, enum: [today, this_week, this_month], description: "Khoảng thời gian định sẵn"}
        category: {type: string, enum: [food, transport, shopping, housing, entertainment, other], description: "Danh mục chi tiêu"}
      required: [period, category]

  - name: record_transaction
    description: "Ghi một giao dịch thu hoặc chi vào dữ liệu cục bộ. Chỉ gọi sau khi đã gọi clarify để xác nhận đầy đủ thông tin và người dùng xác nhận rõ ràng."
    parameters:
      type: object
      properties:
        type: {type: string, enum: [expense, income], description: "Loại giao dịch"}
        amount: {type: number, minimum: 0.01, description: "Số tiền dương, đơn vị VND"}
        category: {type: string, enum: [food, transport, shopping, housing, entertainment, other, salary, other_income], description: "Danh mục giao dịch"}
        note: {type: string, description: "Mô tả giao dịch, không chứa thông tin bí mật"}
        confirmed: {type: boolean, description: "Người dùng đã xác nhận ghi giao dịch"}
      required: [type, amount, category, note, confirmed]

  - name: search_financial_advice
    description: "Tra cứu kiến thức tài chính nội bộ về quy tắc 50/30/20 và quỹ dự phòng. Không thay thế tư vấn tài chính chuyên nghiệp."
    parameters:
      type: object
      properties:
        topic: {type: string, enum: [50_30_20, emergency_fund], description: "Chủ đề cần tra cứu"}
      required: [topic]

  - name: budget_forecast_alert
    description: "Dự báo tốc độ chi tiêu trong tháng và cảnh báo nguy cơ vượt ngân sách hoặc không đạt mục tiêu tiết kiệm. Chỉ đọc dữ liệu cục bộ."
    parameters:
      type: object
      properties:
        month: {type: string, description: "Tháng cần dự báo YYYY-MM"}
      required: [month]
